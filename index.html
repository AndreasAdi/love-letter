<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Letter, Just For You</title>
<meta name="description" content="A little handmade love letter, just for you." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff6f9c' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gochi+Hand&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>

<main class="shop">

  <header class="banner">
    <p class="banner-kicker">&#9733; the lucky love machine &#9733;</p>
    <h1 class="banner-title">Gacha<span>&#9825;</span>Gacha</h1>
  </header>

  <div class="stage">
    <div class="machine" id="machine">
      <div class="marquee" aria-live="polite"><span id="marquee">INSERT &#9825; TO PLAY</span></div>

      <div class="globe" id="globe">
        <div class="pile" id="pile"></div>
        <span class="glare" aria-hidden="true"></span>
      </div>

      <div class="body">
        <div class="face" id="face" aria-hidden="true">
          <span class="eye eye-l"><span class="pupil"></span></span>
          <span class="eye eye-r"><span class="pupil"></span></span>
          <span class="cheek cheek-l"></span>
          <span class="cheek cheek-r"></span>
          <span class="mouth"></span>
        </div>

        <div class="controls">
          <div class="coins" aria-label="Heart coins left">
            <span class="coin-icon" aria-hidden="true">&#9825;</span>
            <span>&times;</span>
            <span id="coin-count">7</span>
          </div>
          <button class="knob" id="knob" type="button" aria-label="Turn the crank">
            <span class="knob-grip"></span>
          </button>
        </div>

        <div class="chute" aria-hidden="true"><span class="chute-flap"></span></div>
      </div>

      <div class="feet" aria-hidden="true"><span></span><span></span></div>
    </div>

    <div class="floor" id="floor"></div>
  </div>

  <p class="hint" id="hint">turn the crank!</p>

  <section class="tray" aria-label="Your collection">
    <p class="tray-title">my collection <span id="tray-count">0/7</span></p>
    <ol class="tray-slots" id="tray"></ol>
  </section>

  <button class="sound-toggle" id="sound-toggle" type="button" aria-label="Toggle sound" aria-pressed="true">
    <svg id="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
      <path d="M18.5 5.5a9.4 9.4 0 0 1 0 13"/>
    </svg>
    <svg id="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="hidden">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
      <line x1="16" y1="9" x2="22" y2="15"/>
      <line x1="22" y1="9" x2="16" y2="15"/>
    </svg>
  </button>
</main>

<!-- A capsule, opened: one reason sticker -->
<div class="modal" id="prize" hidden role="dialog" aria-modal="true" aria-labelledby="prize-title">
  <div class="modal-backdrop" data-close></div>
  <div class="prize">
    <div class="prize-capsule" id="prize-capsule" aria-hidden="true">
      <span class="half half-top"></span>
      <span class="half half-bottom"></span>
    </div>
    <div class="sticker" id="prize-card">
      <p class="sticker-num" id="prize-num"></p>
      <h2 class="sticker-title" id="prize-title"></h2>
      <p class="sticker-text" id="prize-text"></p>
      <button class="pill" id="prize-keep" type="button" data-close>add to collection</button>
    </div>
  </div>
</div>

<!-- The super rare one: the letter -->
<div class="modal" id="reader" hidden role="dialog" aria-modal="true" aria-label="The letter">
  <div class="modal-backdrop" data-close></div>
  <article class="letter">
    <span class="letter-tape" aria-hidden="true"></span>
    <p class="letter-badge">&#9733; super rare &#9733;</p>
    <h2 class="letter-to" id="letter-to"></h2>
    <div class="letter-body" id="letter-body"></div>
    <p class="letter-sign" id="letter-sign"></p>
    <p class="letter-from" id="letter-from"></p>
    <p class="letter-ps" id="letter-ps"></p>
    <button class="pill" id="close-letter" type="button" data-close>okay, now what?</button>
  </article>
</div>

<!-- The question -->
<div class="modal" id="ask" hidden role="dialog" aria-modal="true" aria-labelledby="ask-q">
  <div class="modal-backdrop"></div>
  <section class="ask">
    <div class="ask-face" aria-hidden="true">
      <span class="eye"></span><span class="eye"></span>
      <span class="cheek cheek-l"></span><span class="cheek cheek-r"></span>
      <span class="mouth"></span>
    </div>
    <h2 class="ask-q" id="ask-q"></h2>
    <p class="ask-yes" id="ask-yes" hidden></p>
    <div class="ask-actions" id="ask-actions">
      <button class="pill pill-yes" id="yes-btn" type="button">YES</button>
      <button class="pill pill-no" id="no-btn" type="button">no</button>
    </div>
    <button class="pill pill-ghost" id="ask-done" type="button" hidden>&#9825; back to the machine</button>
  </section>
</div>

<script src="vendor/three.min.js"></script>
<script src="js/scene.js"></script>
<script src="js/main.js"></script>
<script src="js/globe.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
